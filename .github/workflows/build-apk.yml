name: Build Aria Bridge Lite APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Aria Bridge Lite
        uses: actions/checkout@v4

      - name: Vendor aShellYou libadb
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/DP-Hridayan/aShellYou.git vendor/aShellYou
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vendor/aShellYou/libadb/build.gradle.kts")
          s = p.read_text()
          s = s.replace('alias(libs.plugins.android.library)', 'id("com.android.library")')
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AriaBridgeLite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
